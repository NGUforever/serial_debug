[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serial_debug"
version = "1.0.0"
description = "串口调试助手 + 日志查看器：CH343 实时收发 / AT 命令管理 / 日志存储与查看 / 实时数据监视"
readme = "docs/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ericslzwang" }]
keywords = ["serial", "uart", "AT", "debug", "ch343", "tkinter", "log-viewer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Terminals :: Serial",
]
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
serial_debug = "serial_debug.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"serial_debug.resources" = ["assets/*", "common_at.json"]
