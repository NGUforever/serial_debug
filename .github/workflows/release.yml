name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch/tag/SHA)'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: serial_debug-linux-x86_64.tar.gz
          - os: windows-latest
            platform: windows
            artifact: serial_debug-windows-x64.zip
          - os: macos-latest
            platform: macos
            artifact: serial_debug-macos-universal.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial PySide6 pyqtgraph numpy PyOpenGL PyOpenGL-accelerate

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/serial_debug.spec

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          ARCH=$(uname -m)
          # 创建便携启动脚本
          cat > dist/serial_debug/run.sh << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "${HERE}/serial_debug" "$@"
          EOF
          chmod +x dist/serial_debug/run.sh
          tar -czf "dist/serial_debug-linux-${ARCH}.tar.gz" -C dist serial_debug

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/serial_debug/* -DestinationPath dist/serial_debug-windows-x64.zip

      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # .app bundle 已由 spec 生成
          cd dist && zip -r -y serial_debug-macos-universal.zip serial_debug.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            dist/serial_debug-linux-*.tar.gz
            dist/serial_debug-windows-x64.zip
            dist/serial_debug-macos-universal.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          ls -laR artifacts/
          mv artifacts/linux/* artifacts/ 2>/dev/null || true
          mv artifacts/windows/* artifacts/ 2>/dev/null || true
          mv artifacts/macos/* artifacts/ 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
          draft: true
