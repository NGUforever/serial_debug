<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- 主背景：深蓝 → 紫蓝渐变，与调试助手同系但区分 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="50%" stop-color="#103a5c"/>
      <stop offset="100%" stop-color="#0e5374"/>
    </linearGradient>
    <linearGradient id="docFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="100%" stop-color="#0f1a2a"/>
    </linearGradient>
    <linearGradient id="docBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1525"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect width="256" height="256" rx="44" ry="44" fill="url(#bgGrad)"/>
  <!-- 顶部 accent 条 -->
  <rect x="20" y="20" width="216" height="3" rx="1.5" fill="#00d4ff" opacity="0.6"/>

  <!-- 顶部搜索框 -->
  <rect x="28" y="40" width="200" height="24" rx="6" fill="#0a1a2a" stroke="#1a3a5a" stroke-width="1.2"/>
  <!-- 放大镜 -->
  <circle cx="48" cy="52" r="5" fill="none" stroke="#00d4ff" stroke-width="1.6"/>
  <path d="M 51.5 55.5 L 56 60" stroke="#00d4ff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 搜索占位文字 -->
  <text x="62" y="56" font-family="monospace" font-size="10" fill="#5a8ab0">filter logs...</text>

  <!-- 后层文档（右后方堆叠） -->
  <path d="M 130 78 L 196 78 L 214 96 L 214 226 L 130 226 Z"
        fill="url(#docBackGrad)" stroke="#1a3a5a" stroke-width="1.5"
        stroke-linejoin="round"/>
  <path d="M 196 78 L 196 96 L 214 96" fill="none"
        stroke="#1a3a5a" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 前层文档（左前主体） -->
  <path d="M 36 92 L 168 92 L 186 110 L 186 226 L 36 226 Z"
        fill="url(#docFrontGrad)" stroke="#00ff9c" stroke-width="2"
        stroke-linejoin="round" filter="url(#softGlow)"/>
  <!-- 折角 -->
  <path d="M 168 92 L 168 110 L 186 110" fill="none"
        stroke="#00ff9c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 168 92 L 186 110" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

  <!-- 行号侧栏 -->
  <rect x="36" y="92" width="16" height="134" fill="#050a14" opacity="0.7"/>
  <text x="44" y="120" font-family="monospace" font-size="7" fill="#3a6a8a" text-anchor="middle">1</text>
  <text x="44" y="140" font-family="monospace" font-size="7" fill="#3a6a8a" text-anchor="middle">2</text>
  <text x="44" y="160" font-family="monospace" font-size="7" fill="#3a6a8a" text-anchor="middle">3</text>
  <text x="44" y="180" font-family="monospace" font-size="7" fill="#3a6a8a" text-anchor="middle">4</text>
  <text x="44" y="200" font-family="monospace" font-size="7" fill="#3a6a8a" text-anchor="middle">5</text>

  <!-- 5 条日志行 -->
  <!-- 行 1：时间戳 + info -->
  <rect x="58" y="117" width="44" height="3" rx="1" fill="#6a9955"/>
  <rect x="106" y="117" width="68" height="3" rx="1" fill="#569cd6"/>
  <!-- 行 2：高亮匹配行（黄色背景） -->
  <rect x="58" y="132" width="116" height="10" rx="1.5" fill="#3a2a05" opacity="0.9"/>
  <rect x="58" y="135" width="54" height="3" rx="1" fill="#dcdcaa"/>
  <rect x="116" y="135" width="54" height="3" rx="1" fill="#dcdcaa"/>
  <!-- 行 3：warning -->
  <rect x="58" y="152" width="38" height="3" rx="1" fill="#ce9178"/>
  <rect x="100" y="152" width="60" height="3" rx="1" fill="#569cd6"/>
  <!-- 行 4：error -->
  <rect x="58" y="172" width="32" height="3" rx="1" fill="#f44747"/>
  <rect x="94" y="172" width="70" height="3" rx="1" fill="#569cd6"/>
  <!-- 行 5：normal -->
  <rect x="58" y="192" width="52" height="3" rx="1" fill="#4ec9b0"/>
  <rect x="114" y="192" width="52" height="3" rx="1" fill="#569cd6"/>

  <!-- 后层文档的几行 -->
  <rect x="142" y="102" width="64" height="3" rx="1" fill="#4ec9b0" opacity="0.4"/>
  <rect x="142" y="118" width="54" height="3" rx="1" fill="#569cd6" opacity="0.4"/>
  <rect x="142" y="134" width="68" height="3" rx="1" fill="#4ec9b0" opacity="0.4"/>
  <rect x="142" y="150" width="48" height="3" rx="1" fill="#dcdcaa" opacity="0.4"/>

  <!-- 右下角放大镜 -->
  <circle cx="208" cy="208" r="22" fill="#0a1a2a" stroke="#00d4ff" stroke-width="3.5"
          filter="url(#glow)"/>
  <circle cx="208" cy="208" r="22" fill="none" stroke="#00d4ff" stroke-width="3.5"/>
  <!-- 镜片内高光 -->
  <path d="M 199 199 A 11 11 0 0 1 217 199" fill="none" stroke="#ffffff"
        stroke-width="1.5" opacity="0.4"/>
  <!-- 手柄 -->
  <path d="M 224 224 L 240 240" stroke="#00d4ff" stroke-width="5"
        stroke-linecap="round" fill="none" filter="url(#glow)"/>
</svg>
