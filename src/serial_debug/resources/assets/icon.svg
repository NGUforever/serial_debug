<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3a"/>
      <stop offset="55%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="45%" stop-color="#f0f0f0"/>
      <stop offset="55%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="plasticGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" ry="48" fill="url(#bgGrad)"/>
  <!-- 顶部 accent 条 -->
  <rect x="48" y="44" width="160" height="5" rx="2.5" fill="#007acc"/>

  <!-- 顶部时间戳（模拟串口日志行） -->
  <text x="48" y="76" font-family="monospace" font-size="11" fill="#6a9955">[12:34:56.789]</text>
  <text x="48" y="92" font-family="monospace" font-size="11" fill="#dcdcaa">TX:&#gt; AT+ELOG=0%</text>

  <!-- USB Type-A 接头（左侧主体，黄金分割 0.382 左留白） -->
  <!-- 金属外壳 -->
  <rect x="44" y="120" width="78" height="58" rx="6" fill="url(#metalGrad)" stroke="#5a5a5a" stroke-width="1.2"/>
  <!-- 内部黑色塑料芯 -->
  <rect x="52" y="129" width="62" height="40" rx="2" fill="url(#plasticGrad)"/>
  <!-- 4 个金色触点 -->
  <rect x="58" y="137" width="3" height="24" rx="0.5" fill="#d4af37"/>
  <rect x="66" y="137" width="3" height="24" rx="0.5" fill="#d4af37"/>
  <rect x="74" y="137" width="3" height="24" rx="0.5" fill="#d4af37"/>
  <rect x="82" y="137" width="3" height="24" rx="0.5" fill="#d4af37"/>
  <!-- USB 接头上沿高光 -->
  <rect x="44" y="120" width="78" height="3" rx="1.5" fill="#ffffff" opacity="0.35"/>

  <!-- 数据流方波：从 USB 接口右侧涌出 -->
  <path d="M 122 149 L 138 149 L 138 128 L 158 128 L 158 170 L 178 170 L 178 128 L 198 128 L 198 149 L 218 149"
        fill="none" stroke="#4ec9b0" stroke-width="3.5"
        stroke-linejoin="round" stroke-linecap="round"
        filter="url(#glow)"/>
  <path d="M 122 149 L 138 149 L 138 128 L 158 128 L 158 170 L 178 170 L 178 128 L 198 128 L 198 149 L 218 149"
        fill="none" stroke="#4ec9b0" stroke-width="3.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- RX/TX 双向箭头（底部） -->
  <!-- TX 箭头：向右青色 -->
  <path d="M 138 206 L 218 206 M 210 200 L 218 206 L 210 212"
        stroke="#4ec9b0" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="200" font-family="monospace" font-size="11"
        fill="#4ec9b0" text-anchor="middle" font-weight="bold">TX</text>
  <!-- RX 箭头：向左蓝色 -->
  <path d="M 122 224 L 42 224 M 50 218 L 42 224 L 50 230"
        stroke="#569cd6" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="90" y="240" font-family="monospace" font-size="11"
        fill="#569cd6" text-anchor="middle" font-weight="bold">RX</text>
</svg>
